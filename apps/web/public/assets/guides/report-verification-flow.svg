<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Laboratory report verification flow</title>
  <desc id="description">A five-step process for visiting the issuer's official domain, entering the report number, comparing report details, investigating mismatches, and seeking independent advice.</desc>
  <rect width="1200" height="520" rx="32" fill="#fff9df"/>
  <text x="600" y="66" text-anchor="middle" fill="#181207" font-family="Arial, sans-serif" font-size="29" font-weight="700">Verify through the issuing laboratory</text>
  <text x="600" y="98" text-anchor="middle" fill="#735b16" font-family="Arial, sans-serif" font-size="17">A matching online record supports comparison; it does not guarantee the transaction.</text>
  <g font-family="Arial, sans-serif">
    <rect x="52" y="150" width="196" height="220" rx="20" fill="#fdd404" stroke="#b99400" stroke-width="3"/>
    <text x="78" y="192" fill="#181207" font-size="16" font-weight="800">1 · OFFICIAL DOMAIN</text><text x="78" y="236" fill="#181207" font-size="20" font-weight="700">Visit the issuer's</text><text x="78" y="263" fill="#181207" font-size="20" font-weight="700">own website</text><text x="78" y="314" fill="#735b16" font-size="15">Avoid links or screenshots</text><text x="78" y="336" fill="#735b16" font-size="15">supplied without checking.</text>
    <path d="M257 260H276" stroke="#8f741a" stroke-width="5"/><path d="m271 251 12 9-12 9" fill="none" stroke="#8f741a" stroke-width="5"/>
    <rect x="286" y="150" width="196" height="220" rx="20" fill="#ffffff" stroke="#c7b969" stroke-width="3"/>
    <text x="312" y="192" fill="#181207" font-size="16" font-weight="800">2 · REPORT NUMBER</text><text x="312" y="236" fill="#181207" font-size="20" font-weight="700">Enter the exact</text><text x="312" y="263" fill="#181207" font-size="20" font-weight="700">identifier</text><text x="312" y="314" fill="#735b16" font-size="15">Check digits, letters and</text><text x="312" y="336" fill="#735b16" font-size="15">the report date.</text>
    <path d="M491 260H510" stroke="#8f741a" stroke-width="5"/><path d="m505 251 12 9-12 9" fill="none" stroke="#8f741a" stroke-width="5"/>
    <rect x="520" y="150" width="196" height="220" rx="20" fill="#ffffff" stroke="#c7b969" stroke-width="3"/>
    <text x="546" y="192" fill="#181207" font-size="16" font-weight="800">3 · COMPARE</text><text x="546" y="236" fill="#181207" font-size="20" font-weight="700">Match identity,</text><text x="546" y="263" fill="#181207" font-size="20" font-weight="700">weight and size</text><text x="546" y="304" fill="#735b16" font-size="15">Also compare treatment,</text><text x="546" y="326" fill="#735b16" font-size="15">colour and photograph</text><text x="546" y="348" fill="#735b16" font-size="15">where shown.</text>
    <path d="M725 260H744" stroke="#8f741a" stroke-width="5"/><path d="m739 251 12 9-12 9" fill="none" stroke="#8f741a" stroke-width="5"/>
    <rect x="754" y="150" width="196" height="220" rx="20" fill="#ffffff" stroke="#c7b969" stroke-width="3"/>
    <text x="780" y="192" fill="#181207" font-size="16" font-weight="800">4 · MISMATCH?</text><text x="780" y="236" fill="#181207" font-size="20" font-weight="700">Pause and ask</text><text x="780" y="263" fill="#181207" font-size="20" font-weight="700">for clarification</text><text x="780" y="314" fill="#735b16" font-size="15">Do not assume fraud—or</text><text x="780" y="336" fill="#735b16" font-size="15">assume authenticity.</text>
    <path d="M959 260H978" stroke="#8f741a" stroke-width="5"/><path d="m973 251 12 9-12 9" fill="none" stroke="#8f741a" stroke-width="5"/>
    <rect x="988" y="150" width="160" height="220" rx="20" fill="#181207" stroke="#181207" stroke-width="3"/>
    <text x="1014" y="192" fill="#fdd404" font-size="16" font-weight="800">5 · ADVICE</text><text x="1014" y="236" fill="#ffffff" font-size="20" font-weight="700">Seek an</text><text x="1014" y="263" fill="#ffffff" font-size="20" font-weight="700">independent</text><text x="1014" y="290" fill="#ffffff" font-size="20" font-weight="700">opinion</text><text x="1014" y="330" fill="#f7e9a3" font-size="15">When the value or</text><text x="1014" y="352" fill="#f7e9a3" font-size="15">risk warrants it.</text>
  </g>
  <rect x="180" y="416" width="840" height="58" rx="29" fill="#ffffff" stroke="#d6c98c" stroke-width="2"/>
  <text x="600" y="451" text-anchor="middle" fill="#181207" font-family="Arial, sans-serif" font-size="16" font-weight="700">Verification checks a record. It does not establish ownership, value or seller reliability.</text>
</svg>
