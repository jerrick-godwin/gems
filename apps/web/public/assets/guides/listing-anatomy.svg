<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Anatomy of a fictional gemstone listing</title>
  <desc id="description">A fictional sapphire listing with numbered callouts for photographs, gem details, origin and treatment statements, laboratory report status, price, seller, and location.</desc>
  <rect width="1200" height="720" rx="32" fill="#fff9df"/>
  <rect x="40" y="42" width="1120" height="636" rx="24" fill="#ffffff" stroke="#d6c98c" stroke-width="3"/>
  <text x="78" y="92" fill="#181207" font-family="Arial, sans-serif" font-size="28" font-weight="700">Illustrative fictional listing</text>
  <text x="78" y="122" fill="#735b16" font-family="Arial, sans-serif" font-size="17">Use listing details as questions to verify, not proof of authenticity.</text>

  <rect x="78" y="160" width="430" height="300" rx="18" fill="#17120b"/>
  <ellipse cx="294" cy="306" rx="98" ry="72" fill="#245ca8" transform="rotate(-12 294 306)"/>
  <ellipse cx="272" cy="278" rx="46" ry="27" fill="#75b8ef" opacity=".78" transform="rotate(-12 272 278)"/>
  <path d="M205 302 270 235 380 279 322 376 224 359Z" fill="none" stroke="#b9dcff" stroke-width="5" opacity=".7"/>
  <rect x="92" y="410" width="82" height="32" rx="16" fill="#fdd404"/>
  <text x="133" y="432" text-anchor="middle" fill="#181207" font-family="Arial, sans-serif" font-size="15" font-weight="700">1 of 5</text>

  <text x="550" y="184" fill="#806719" font-family="Arial, sans-serif" font-size="15" font-weight="700">SAPPHIRE</text>
  <text x="550" y="223" fill="#181207" font-family="Arial, sans-serif" font-size="29" font-weight="700">Fictional blue sapphire</text>
  <line x1="550" y1="242" x2="1110" y2="242" stroke="#e2d9b4" stroke-width="2"/>
  <text x="550" y="278" fill="#735b16" font-family="Arial, sans-serif" font-size="18">Weight</text><text x="820" y="278" fill="#181207" font-family="Arial, sans-serif" font-size="18" font-weight="700">3.20 ct</text>
  <text x="550" y="314" fill="#735b16" font-family="Arial, sans-serif" font-size="18">Measurements</text><text x="820" y="314" fill="#181207" font-family="Arial, sans-serif" font-size="18" font-weight="700">9.1 × 7.0 × 5.2 mm</text>
  <text x="550" y="350" fill="#735b16" font-family="Arial, sans-serif" font-size="18">Colour / shape</text><text x="820" y="350" fill="#181207" font-family="Arial, sans-serif" font-size="18" font-weight="700">Blue / oval</text>
  <text x="550" y="386" fill="#735b16" font-family="Arial, sans-serif" font-size="18">Seller states</text><text x="820" y="386" fill="#181207" font-family="Arial, sans-serif" font-size="18" font-weight="700">Sri Lanka / heated</text>
  <text x="550" y="422" fill="#735b16" font-family="Arial, sans-serif" font-size="18">Laboratory report</text><text x="820" y="422" fill="#181207" font-family="Arial, sans-serif" font-size="18" font-weight="700">Available — verify issuer</text>

  <rect x="78" y="496" width="1032" height="124" rx="16" fill="#fff4b6" stroke="#d6c98c" stroke-width="2"/>
  <text x="108" y="536" fill="#735b16" font-family="Arial, sans-serif" font-size="16">Asking price</text>
  <text x="108" y="573" fill="#181207" font-family="Arial, sans-serif" font-size="28" font-weight="700">LKR 1,250,000</text>
  <text x="450" y="536" fill="#735b16" font-family="Arial, sans-serif" font-size="16">Seller</text>
  <text x="450" y="573" fill="#181207" font-family="Arial, sans-serif" font-size="20" font-weight="700">Example Gems</text>
  <text x="760" y="536" fill="#735b16" font-family="Arial, sans-serif" font-size="16">Location</text>
  <text x="760" y="573" fill="#181207" font-family="Arial, sans-serif" font-size="20" font-weight="700">Colombo, Sri Lanka</text>

  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#181207">
    <circle cx="92" cy="174" r="19" fill="#fdd404"/><text x="92" y="180">1</text>
    <circle cx="526" cy="270" r="19" fill="#fdd404"/><text x="526" y="276">2</text>
    <circle cx="526" cy="378" r="19" fill="#fdd404"/><text x="526" y="384">3</text>
    <circle cx="526" cy="414" r="19" fill="#fdd404"/><text x="526" y="420">4</text>
    <circle cx="90" cy="510" r="19" fill="#fdd404"/><text x="90" y="516">5</text>
    <circle cx="432" cy="510" r="19" fill="#fdd404"/><text x="432" y="516">6</text>
    <circle cx="742" cy="510" r="19" fill="#fdd404"/><text x="742" y="516">7</text>
  </g>
  <text x="600" y="654" text-anchor="middle" fill="#735b16" font-family="Arial, sans-serif" font-size="15">Fictional educational example — not an offer for sale</text>
</svg>
