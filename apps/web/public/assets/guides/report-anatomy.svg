<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Anatomy of an illustrative gemstone laboratory report</title>
  <desc id="description">A generic fictional report layout showing report number, date, tested identity, natural or laboratory-grown status, weight, measurements, colour, detectable treatments, photograph, and an optional origin opinion.</desc>
  <rect width="1200" height="720" rx="32" fill="#fff9df"/>
  <rect x="176" y="36" width="848" height="648" rx="18" fill="#ffffff" stroke="#c7b969" stroke-width="3"/>
  <rect x="176" y="36" width="848" height="90" rx="18" fill="#181207"/>
  <rect x="176" y="106" width="848" height="20" fill="#181207"/>
  <text x="214" y="78" fill="#fdd404" font-family="Arial, sans-serif" font-size="24" font-weight="700">INDEPENDENT GEMOLOGICAL REPORT</text>
  <text x="214" y="106" fill="#ffffff" font-family="Arial, sans-serif" font-size="15">ILLUSTRATIVE EXAMPLE — NOT A LABORATORY REPORT</text>
  <text x="214" y="166" fill="#735b16" font-family="Arial, sans-serif" font-size="15">REPORT NUMBER</text><text x="470" y="166" fill="#181207" font-family="Arial, sans-serif" font-size="18" font-weight="700">EX-2026-0142</text>
  <text x="704" y="166" fill="#735b16" font-family="Arial, sans-serif" font-size="15">DATE</text><text x="840" y="166" fill="#181207" font-family="Arial, sans-serif" font-size="18" font-weight="700">16 July 2026</text>
  <line x1="214" y1="190" x2="986" y2="190" stroke="#e2d9b4" stroke-width="2"/>
  <rect x="214" y="220" width="252" height="224" rx="14" fill="#fff4b6"/>
  <ellipse cx="340" cy="330" rx="76" ry="58" fill="#356db3" transform="rotate(-9 340 330)"/>
  <path d="M275 324 325 276 405 310 362 387 292 372Z" fill="none" stroke="#b9dcff" stroke-width="4" opacity=".75"/>
  <text x="340" y="423" text-anchor="middle" fill="#735b16" font-family="Arial, sans-serif" font-size="14">Illustrative specimen photograph</text>
  <g font-family="Arial, sans-serif">
    <text x="510" y="228" fill="#735b16" font-size="15">TESTED IDENTITY</text><text x="510" y="257" fill="#181207" font-size="20" font-weight="700">Natural corundum — sapphire</text>
    <text x="510" y="298" fill="#735b16" font-size="15">WEIGHT</text><text x="710" y="298" fill="#181207" font-size="18" font-weight="700">3.02 ct</text>
    <text x="510" y="336" fill="#735b16" font-size="15">MEASUREMENTS</text><text x="710" y="336" fill="#181207" font-size="18" font-weight="700">8.9 × 6.8 × 5.1 mm</text>
    <text x="510" y="374" fill="#735b16" font-size="15">COLOUR</text><text x="710" y="374" fill="#181207" font-size="18" font-weight="700">Blue</text>
    <text x="510" y="412" fill="#735b16" font-size="15">SHAPE</text><text x="710" y="412" fill="#181207" font-size="18" font-weight="700">Oval, mixed cut</text>
  </g>
  <rect x="214" y="474" width="772" height="76" rx="12" fill="#fff9df" stroke="#e2d9b4" stroke-width="2"/>
  <text x="236" y="502" fill="#735b16" font-family="Arial, sans-serif" font-size="14">DETECTABLE TREATMENTS</text>
  <text x="236" y="532" fill="#181207" font-family="Arial, sans-serif" font-size="18" font-weight="700">Indications of heating observed</text>
  <rect x="214" y="566" width="772" height="76" rx="12" fill="#fff9df" stroke="#e2d9b4" stroke-width="2"/>
  <text x="236" y="594" fill="#735b16" font-family="Arial, sans-serif" font-size="14">ORIGIN OPINION — ONLY WHERE THE LAB OFFERS IT</text>
  <text x="236" y="624" fill="#181207" font-family="Arial, sans-serif" font-size="18" font-weight="700">Not requested in this fictional example</text>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#181207">
    <circle cx="154" cy="158" r="19" fill="#fdd404"/><text x="154" y="164">1</text>
    <circle cx="1046" cy="158" r="19" fill="#fdd404"/><text x="1046" y="164">2</text>
    <circle cx="154" cy="330" r="19" fill="#fdd404"/><text x="154" y="336">3</text>
    <circle cx="1046" cy="252" r="19" fill="#fdd404"/><text x="1046" y="258">4</text>
    <circle cx="1046" cy="330" r="19" fill="#fdd404"/><text x="1046" y="336">5</text>
    <circle cx="1046" cy="406" r="19" fill="#fdd404"/><text x="1046" y="412">6</text>
    <circle cx="1046" cy="512" r="19" fill="#fdd404"/><text x="1046" y="518">7</text>
    <circle cx="1046" cy="604" r="19" fill="#fdd404"/><text x="1046" y="610">8</text>
  </g>
</svg>
